name: Sync release notes

on:
  push:
    paths:
      - '.github/workflows/sync-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite release bodies from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for TAG in v1.0.9 v1.0.8 v1.0; do
            awk -v tag="$TAG" '
              $0 ~ ("^## " tag "([ (]|$)") {flag=1; next}
              /^## / {flag=0}
              flag {print}
            ' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then
              gh release edit "$TAG" --notes-file notes.md && echo "$TAG updated" \
                || echo "$TAG edit failed (release missing?)"
            else
              echo "$TAG: no section in CHANGELOG.md, skipped"
            fi
          done
